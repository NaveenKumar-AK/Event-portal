<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Access &amp; Login — ServeDeServe</title>
  <meta name="description" content="Sign in to ServeDeServe as an Administrator or access the Community User Event Portal.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      margin: 0;
      padding: 0;
    }
    #app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .login-page-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      background: radial-gradient(circle at 15% 15%, #f5f3ff 0%, #faf5ff 40%, #fdf4ff 100%);
      overflow: hidden;
    }
    .login-card-compact {
      width: min(100%, 415px);
      background: #ffffff;
      border: 1.5px solid #e9d5ff;
      border-radius: 24px;
      padding: 16px 24px;
      box-shadow: 0 18px 40px -10px rgba(107, 33, 168, 0.16), 0 0 0 1px #f3e8ff;
      text-align: center;
      margin: auto;
    }
    .portal-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #f3e8ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
    }
    .login-icon-compact {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: #f3e8ff;
      color: var(--primary);
      display: grid;
      place-items: center;
      margin: 0 auto 4px;
    }
    .login-icon-compact svg {
      width: 17px;
      height: 17px;
    }
    .login-form-compact {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      text-align: left;
    }
    .login-form-compact .field {
      margin-bottom: 0;
    }
    .login-form-compact label {
      font-size: 0.77rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
      display: block;
    }
    .login-form-compact input {
      padding: 6px 10px;
      font-size: 0.88rem;
      border-radius: 7px;
      border: 1px solid var(--border);
      width: 100%;
      height: 33px;
      background: #fafafa;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .login-form-compact input:focus {
      background: #fff;
      border-color: var(--primary);
    }
    .login-btn-compact {
      width: 100%;
      padding: 8px 14px;
      font-size: 0.92rem;
      border-radius: 9px;
      height: 37px;
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="/js/shared.js"></script>
  <script>
    function renderLoginPage() {
      document.getElementById('app').innerHTML = `
        ${renderHeader('login')}
        <main class="login-page-main" id="main">
          <div class="login-card-compact">
            
            <div class="login-icon-compact">
              ${icons.userRound}
            </div>
            <div class="portal-badge">COMMUNITY PARTICIPANT</div>
            <h1 style="font-size:1.35rem;margin-bottom:2px;color:var(--text);letter-spacing:-0.01em;">User Event Portal</h1>
            <p style="color:var(--text-2);font-size:0.8rem;margin-bottom:0;line-height:1.35;">
              Explore accessible community events, view galleries, and track registrations.
            </p>

            <form onsubmit="handleUserLogin(event)" class="login-form-compact" autocomplete="off">
              <div class="field">
                <label for="userName">Full Name <span style="color:var(--error);">*</span></label>
                <input type="text" id="userName" required placeholder="Enter your full name" autocomplete="off">
              </div>
              <div class="field">
                <label for="userEmail">Email Address <span style="color:var(--error);">*</span></label>
                <input type="email" id="userEmail" required placeholder="your.name@example.com" autocomplete="off">
              </div>
              <div class="field">
                <label for="userDept">Community Role / Organization <span style="font-weight:400;color:var(--muted);">(Optional)</span></label>
                <input type="text" id="userDept" placeholder="e.g. Volunteer, Student, Resident" autocomplete="off">
              </div>

              <button type="submit" class="button button--primary login-btn-compact">
                <span>Enter Event Portal</span> ${icons.arrowRight}
              </button>
            </form>

          </div>
        </main>
        ${renderA11yPanel()}
      `;
    }

    function handleUserLogin(e) {
      e.preventDefault();
      const name = document.getElementById('userName').value.trim();
      const email = document.getElementById('userEmail').value.trim();
      const dept = document.getElementById('userDept') ? document.getElementById('userDept').value.trim() : 'Community Member';
      
      if (!name || !email) {
        alert('Please enter your name and email address.');
        return;
      }

      sessionStorage.removeItem('adminToken');
      sessionStorage.removeItem('adminUser');
      sessionStorage.setItem('sds-user-profile', JSON.stringify({ name, email, department: dept }));
      sessionStorage.setItem('sds-active-role', 'user');
      window.location.href = '/events';
    }

    renderLoginPage();
  </script>
</body>
</html>
